<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Feature graphic</title>
  <!-- Google Play "feature graphic" (1024×500). Rendered to PNG by tools/store-shots.mjs. -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { position: static; width: 1024px; height: 500px; overflow: hidden; }
    body { background: radial-gradient(120% 130% at 25% 15%, #f7f9ec 0%, #dbe8c6 55%, #b9d394 100%); color: #2b2522; }
    .wrap { position: relative; width: 1024px; height: 500px; }
    .text { position: absolute; left: 64px; top: 112px; width: 430px; }
    h1 { margin: 0; font: 700 72px/1.02 ui-serif, "New York", Georgia, serif; letter-spacing: -.01em; }
    .tag { margin: 18px 0 0; font-size: 28px; color: #55604a; }
    .pub { position: absolute; left: 64px; bottom: 48px; display: flex; align-items: center; gap: 12px; color: #6f4a35; }
    .pub img { width: 52px; }
    .pub span { font: 700 22px/1 ui-serif, "New York", Georgia, serif; }
    .board { position: absolute; left: 520px; top: 72px; --cs: 76px; transform: rotate(3deg); box-shadow: 0 24px 60px rgba(50, 60, 20, .35), inset 0 2px 0 rgba(255, 255, 255, .25); }
    .pen.grab .fence { transform: scale(1.04); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="text">
      <h1 id="title">Få fårene hjem</h1>
      <p class="tag" id="tag">Et roligt puslespil – i dit eget tempo</p>
    </div>
    <div class="board" id="board"></div>
    <div class="pub"><img src="../assets/logo.svg" alt=""><span>Trippus Games</span></div>
  </div>
  <script type="module">
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'Bring the Sheep Home';
      document.getElementById('tag').textContent = 'A calm puzzle – at your own pace';
    }
    // Borrow the sheep and hedge drawings from the game itself.
    const html = await (await fetch('../index.html')).text();
    const defs = new DOMParser().parseFromString(html, 'text/html').querySelector('svg defs');
    document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute">${defs.outerHTML}</svg>`);

    // A small meadow, mid-game: [x, y, colour] sheep, [x, y, kind] obstacles, [colour, x, y, w, h, left] pens.
    const C = [
      { pen: '#e0607e', wool: '#f6c1cf', edge: '#c97f93', sym: '♥︎' },
      { pen: '#3f86d8', wool: '#bcd6f5', edge: '#7c9fcb', sym: '★︎' },
      { pen: '#d39d0c', wool: '#f8e39a', edge: '#c9a94a', sym: '●︎' },
    ];
    const W = 6, H = 4;
    const sheep = [[2, 0, 0], [3, 1, 0], [2, 2, 0], [4, 0, 1], [5, 1, 1], [4, 2, 1], [0, 3, 2], [1, 2, 2]];
    const obstacles = [[5, 3, 'hedge'], [3, 3, 'tree'], [0, 0, 'stone']];
    const pens = [[0, 1, 1, 1, 1, 3, true], [1, 4, 3, 1, 1, 3], [2, 0, 1, 1, 2, 2]];
    const board = document.getElementById('board');
    board.style.setProperty('--cols', W);
    board.style.setProperty('--rows', H);
    let out = '<div class="meadow"></div>';
    for (const [x, y, k] of obstacles) out += `<div class="piece obstacle" style="--x:${x};--y:${y}"><svg><use href="#${k}"/></svg></div>`;
    for (const [x, y, c] of sheep) {
      const col = C[c];
      out += `<div class="piece sheep" style="--x:${x};--y:${y};--wool:${col.wool};--wool-edge:${col.edge};--pen:${col.pen}"><svg><use href="#sheep"/></svg><span class="sym">${col.sym}</span></div>`;
    }
    for (const [c, x, y, w, h, left, grab] of pens) {
      out += `<div class="piece pen${grab ? ' grab' : ''}" style="--x:${x};--y:${y};--w:${w};--h:${h};--pen:${C[c].pen}"><div class="fence"><span class="tag"><i>${C[c].sym}</i><b>${left}</b></span></div></div>`;
    }
    board.innerHTML = out;
  </script>
</body>
</html>
