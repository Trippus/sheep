<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Feature graphic</title>
  <!-- Google Play "feature graphic" (1024×500). Rendered to PNG by tools/store-shots.mjs. -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { position: static; width: 1024px; height: 500px; overflow: hidden; }
    body { background: radial-gradient(120% 130% at 25% 15%, #f7f9ec 0%, #dbe8c6 55%, #b9d394 100%); color: #2b2522; }
    .wrap { position: relative; width: 1024px; height: 500px; }
    .text { position: absolute; left: 64px; top: 112px; width: 430px; }
    h1 { margin: 0; font: 700 72px/1.02 ui-serif, "New York", Georgia, serif; letter-spacing: -.01em; }
    .tagline { margin: 18px 0 0; font-size: 28px; color: #55604a; }
    .pub { position: absolute; left: 64px; bottom: 48px; display: flex; align-items: center; gap: 12px; color: #6f4a35; }
    .pub img { width: 52px; }
    .pub span { font: 700 22px/1 ui-serif, "New York", Georgia, serif; }
    .board { position: absolute; left: 500px; top: 38px; --cs: 70px; --m: 1; transform: rotate(3deg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="text">
      <h1 id="title">Få fårene hjem</h1>
      <p class="tagline" id="tagline">Et puslespil om at få foldene forbi hinanden</p>
    </div>
    <div class="board" id="board"></div>
    <div class="pub"><img src="../assets/logo.svg" alt=""><span>Trippus Games</span></div>
  </div>
  <script type="module">
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'Bring the Sheep Home';
      document.getElementById('tagline').textContent = 'A puzzle about getting the pens past each other';
    }
    // Borrow the sheep drawing and the pen outline filters from the game itself.
    const html = await (await fetch('../index.html')).text();
    const defs = new DOMParser().parseFromString(html, 'text/html').querySelector('svg defs');
    document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute">${defs.outerHTML}</svg>`);

    // A crowded meadow mid-game, drawn with the same markup as js/app.js:
    // sheep [x, y, colour], pens [colour, x, y, cells, left, grabbed], a shelter [x, y, side, colours].
    const C = [
      { pen: '#e0607e', wool: '#f6c1cf', edge: '#c97f93', sym: '♥︎' },
      { pen: '#3f86d8', wool: '#bcd6f5', edge: '#7c9fcb', sym: '★︎' },
      { pen: '#d39d0c', wool: '#f8e39a', edge: '#c9a94a', sym: '●︎' },
      { pen: '#8a5cc4', wool: '#dccbf2', edge: '#a58bcb', sym: '■︎' },
    ];
    const W = 5, H = 4;
    const sheep = [[2, 0, 0], [3, 0, 1], [4, 0, 3], [3, 1, 2], [4, 1, 0], [0, 3, 3], [1, 3, 1], [4, 3, 2], [2, 3, 0]];
    const pens = [
      [0, 0, 0, [[0, 0], [0, 1], [1, 1]], 3, true],
      [1, 2, 1, [[0, 0], [0, 1]], 2],
      [2, 0, 2, [[0, 0], [1, 0]], 2],
      [3, 3, 2, [[0, 0], [1, 0], [1, 1]], 3],
    ];
    const shelter = [4, 2, 'e', [1, 3, 0]];
    const sheepHtml = (c) => `<svg style="--wool:${C[c].wool};--wool-edge:${C[c].edge}"><use href="#sheep"/></svg><span class="sym" style="--pen:${C[c].pen}">${C[c].sym}</span>`;

    const board = document.getElementById('board');
    board.style.setProperty('--cols', W);
    board.style.setProperty('--rows', H);
    let out = '<div class="meadow"></div>';
    const [qx, qy, side, q] = shelter;
    out += `<div class="piece queue side-${side}" style="--x:${qx + 1};--y:${qy}">` +
      `<div class="behind b1"><svg style="--wool:${C[q[1]].wool};--wool-edge:${C[q[1]].edge}"><use href="#sheep"/></svg></div>` +
      `<div class="front">${sheepHtml(q[0])}</div></div>`;
    for (const [x, y, c] of sheep) out += `<div class="piece sheep" style="--x:${x};--y:${y}">${sheepHtml(c)}</div>`;
    for (const [c, x, y, cells, left, grab] of pens) {
      const bw = Math.max(...cells.map((p) => p[0])) + 1;
      const bh = Math.max(...cells.map((p) => p[1])) + 1;
      const rects = cells.map(([cx, cy]) => `<rect x="${cx * 100 - 1}" y="${cy * 100 - 1}" width="102" height="102"/>`).join('');
      const [tx, ty] = cells[1] || cells[0];
      out += `<div class="piece pen${grab ? ' grab' : ''}" style="--x:${x};--y:${y};--pen:${C[c].pen}">` +
        `<svg class="shape" viewBox="0 0 ${bw * 100} ${bh * 100}" style="--bw:${bw};--bh:${bh}"><g class="edge" filter="url(#penEdge)">${rects}</g><g class="floor" filter="url(#penFill)">${rects}</g></svg>` +
        `<div class="cell" style="--cx:${tx};--cy:${ty}"><span class="tag"><i>${C[c].sym}</i><b>${left}</b></span></div></div>`;
    }
    board.innerHTML = out;
  </script>
</body>
</html>
